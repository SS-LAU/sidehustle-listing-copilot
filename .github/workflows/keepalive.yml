name: Keep the Render demo awake

# Render's free tier spins a web service down after ~15 minutes with no traffic, and the
# next request then takes 30-60s to cold-start. This workflow pings /health on a schedule
# so the demo is usually awake when someone opens the link.
#
# Reality check: GitHub runs scheduled workflows on a best-effort basis and heavily
# throttles short intervals. Measured on this repo, a */5 cron actually fired every
# 2-5 hours — nowhere near Render's 15-minute idle window. So treat this as a nudge,
# not a guarantee: the first visitor after a quiet spell will still hit a cold start.
# If you need the demo genuinely always-warm, point an external pinger (cron-job.org,
# UptimeRobot) at /health every 10 minutes instead of relying on this cron.
#
# Notes:
#   - GitHub disables scheduled workflows in public repos after 60 days without repository
#     activity. Re-enable it from the Actions tab if that ever happens.
#   - Delete this file if you would rather let the instance sleep (it costs nothing to run,
#     but a permanently-awake service consumes the whole free monthly instance-hour budget).
#   - /health always returns 200, even when Ollama is unreachable, so this is a pure
#     liveness probe and never depends on the model being available.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /health
        run: |
          set -uo pipefail
          URL="https://sidehustle-listing-copilot.onrender.com/health"

          # A cold start takes 30-60s (occasionally longer). A transient DNS or edge
          # error fails *instantly*, and plain `--retry` does not retry a refused
          # connection — that is exactly how run #11 died in under a second. So retry
          # explicitly and never let a curl exit code abort the loop.
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -m 90 -w '%{http_code}' "$URL" || true)
            echo "attempt ${attempt}: GET ${URL} -> HTTP ${code}"
            if [ "$code" = "200" ]; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done

          # Still fails the job if all three attempts miss, so a genuinely dead demo
          # is visible instead of silently green.
          test "$code" = "200"
